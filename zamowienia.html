<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Koszyk | EchoCode</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AWRPmyYat0AVU0yOtzFDvaOwmLzI7zA18BrxiITvdnd7KRhqgYKCDRzXGf6-60Dsi4vUKIW50vymZI-&currency=PLN"></script>
    <style>
        body { background: #050508; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .container { background: #11111a; padding: 30px; border-radius: 20px; width: 400px; border: 1px solid #8b5cf6; }
        .item { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 10px; background: #1a1a26; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Twój Koszyk</h2>
        <div id="cartItems"></div>
        <hr style="margin: 20px 0; opacity: 0.1;">
        <div style="display:flex; justify-content:space-between; font-size: 20px; font-weight: bold;">
            <span>Suma:</span> <span id="total">0.00 PLN</span>
        </div>
        <div id="paypal-button-container" style="margin-top: 20px;"></div>
        <a href="index.html" style="color: #8b5cf6; text-decoration: none; display: block; text-align: center; margin-top: 20px;">Wróć do sklepu</a>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const container = document.getElementById("cartItems");
        let sum = 0;

        cart.forEach(item => {
            sum += item.price;
            container.innerHTML += `<div class="item"><span>${item.name}</span><b>${item.price} PLN</b></div>`;
        });
        document.getElementById("total").innerText = sum.toFixed(2) + " PLN";

        if(sum > 0) {
            paypal.Buttons({
                createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: sum.toFixed(2) } }] }),
                onApprove: (data, actions) => actions.order.capture().then(() => {
                    fetch('zapisz_zamowienie.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            discord: "OPŁACONO",
                            items: cart.map(i => i.name).join(", "),
                            total: sum.toFixed(2) + " PLN",
                            desc: "Klient sfinalizował płatność przez PayPal."
                        })
                    });
                    alert("Zapłacono!");
                    localStorage.removeItem('cart');
                    window.location.href = "index.html";
                })
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
