<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koszyk | EchoCode</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AWRPmyYat0AVU0yOtzFDvaOwmLzI7zA18BrxiITvdnd7KRhqgYKCDRzXGf6-60Dsi4vUKIW50vymZI-&currency=PLN"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #8b5cf6;
            --danger: #ff4d4d;
            --card-bg: #11111a;
            --input-bg: #1a1a26;
        }

        body { 
            background: #050508; 
            color: #e2e8f0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container { 
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px; 
            border-radius: 28px; 
            border: 1px solid rgba(139, 92, 246, 0.2); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { 
            font-weight: 800; 
            font-size: 1.8rem; 
            margin-bottom: 30px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }

        /* Elementy w koszyku */
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 16px; 
            background: rgba(255, 255, 255, 0.03); 
            margin-bottom: 12px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cart-item:hover {
            background: rgba(139, 92, 246, 0.05);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .item-info b { display: block; font-size: 1rem; color: #fff; }
        .item-info span { font-size: 0.85rem; color: #8b5cf6; font-weight: 600; }

        /* Przycisk usuwania X */
        .remove-btn { 
            background: rgba(255, 77, 77, 0.1); 
            color: var(--danger); 
            border: none; 
            width: 38px; 
            height: 38px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .remove-btn:hover { 
            background: var(--danger); 
            color: white; 
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
        }

        /* Sekcja kodu rabatowego */
        .promo-box { margin-top: 25px; }
        .promo-box label { font-size: 12px; color: #64748b; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        
        .promo-input-group { display: flex; gap: 8px; }

        input { 
            flex: 1; 
            padding: 14px; 
            background: var(--input-bg); 
            border: 1px solid #2d2d3d; 
            border-radius: 14px; 
            color: white; 
            font-family: inherit;
        }

        .btn-apply { 
            background: var(--accent); 
            border: none; 
            padding: 0 20px; 
            color: white; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-apply:hover { opacity: 0.9; transform: scale(1.02); }

        /* Podsumowanie */
        .summary { 
            margin: 30px 0; 
            padding-top: 20px;
            border-top: 1px solid #2d2d3d;
            display: flex; 
            justify-content: space-between; 
            align-items: baseline;
        }

        .summary .label { font-size: 1.1rem; color: #94a3b8; }
        .summary .price { font-size: 1.8rem; font-weight: 800; color: #fff; }

        /* Linki i przyciski na dole */
        .empty-cart { text-align: center; color: #475569; padding: 20px 0; }
        
        .clear-link { 
            display: block; text-align: center; color: #64748b; 
            text-decoration: none; font-size: 13px; margin-top: 20px; transition: 0.2s;
        }
        .clear-link:hover { color: var(--danger); }

        .back-btn {
            display: block; text-align: center; margin-top: 20px;
            color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-shopping-cart" style="color:var(--accent)"></i> Koszyk</h1>
    
    <div id="cartItems">
        </div>

    <div class="promo-box">
        <label>Kod rabatowy</label>
        <div class="promo-input-group">
            <input type="text" id="promoInput" placeholder="Wpisz kod...">
            <button class="btn-apply" onclick="applyPromo()">Zastosuj</button>
        </div>
        <p id="promoMsg" style="color:#10b981; font-size:12px; display:none; margin-top:8px;"></p>
    </div>

    <div class="summary">
        <span class="label">Suma</span>
        <span class="price" id="total">0.00 PLN</span>
    </div>
    
    <div id="paypal-button-container"></div>

    <a href="#" class="clear-link" onclick="clearCart()">Wyczyść wszystko</a>
    <a href="index.html" class="back-btn">← Wróć do sklepu</a>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const CODES = { "START": 0.10, "ECHO20": 0.20 };
    let discount = 0;

    function displayCart() {
        const container = document.getElementById("cartItems");
        const totalElement = document.getElementById("total");
        
        if (cart.length === 0) {
            container.innerHTML = `<div class="empty-cart">Twój koszyk świeci pustkami...</div>`;
            totalElement.innerText = "0.00 PLN";
            document.getElementById("paypal-button-container").innerHTML = "";
            return;
        }

        container.innerHTML = "";
        let sum = 0;

        cart.forEach((item, index) => {
            sum += item.price;
            container.innerHTML += `
                <div class="cart-item">
                    <div class="item-info">
                        <b>${item.name}</b>
                        <span>${item.price.toFixed(2)} PLN</span>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${index})">
                        <i class="fas fa-trash-can"></i>
                    </button>
                </div>
            `;
        });

        let final = sum * (1 - discount);
        totalElement.innerText = final.toFixed(2) + " PLN";
        
        document.getElementById("paypal-button-container").innerHTML = "";
        if(final > 0) renderPayPal(final);
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
    }

    function applyPromo() {
        const code = document.getElementById("promoInput").value.toUpperCase();
        if(CODES[code]) {
            discount = CODES[code];
            const msg = document.getElementById("promoMsg");
            msg.innerText = "KOD AKTYWNY: -" + (discount * 100) + "%";
            msg.style.display = "block";
            displayCart();
        } else { alert("Błędny kod!"); }
    }

    function clearCart() { 
        if(confirm("Opróżnić koszyk?")) {
            localStorage.removeItem('cart'); 
            cart = []; 
            displayCart(); 
        }
    }

    function renderPayPal(amount) {
        paypal.Buttons({
            style: { shape: 'rect', color: 'blue', height: 45 },
            createOrder: (data, actions) => actions.order.create({
                purchase_units: [{ amount: { value: amount.toFixed(2), currency_code: 'PLN' } }]
            }),
            onApprove: (data, actions) => actions.order.capture().then(() => {
                alert("Płatność udana!");
                clearCart();
            })
        }).render('#paypal-button-container');
    }

    displayCart();
</script>

</body>
</html>
