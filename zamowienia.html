<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Twój Koszyk | EchoCode</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AWRPmyYat0AVU0yOtzFDvaOwmLzI7zA18BrxiITvdnd7KRhqgYKCDRzXGf6-60Dsi4vUKIW50vymZI-&currency=PLN"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background:#08080e; color:white; font-family:'Poppins',sans-serif; padding: 50px 10%; }
        .container { background: rgba(20,20,32,0.6); padding: 40px; border-radius: 25px; border: 1px solid rgba(139,92,246,0.2); max-width: 700px; margin: 0 auto; }
        .cart-item { display:flex; justify-content:space-between; padding:15px; background:rgba(255,255,255,0.03); margin-bottom:10px; border-radius:10px; }
        input { width: 100%; padding:12px; background:#1a1a24; border:1px solid #333; border-radius:10px; color:white; margin: 10px 0; }
        .total { font-size: 24px; font-weight:800; margin-top:20px; display:flex; justify-content:space-between; }
        .btn-promo { background: #8b5cf6; border:none; padding:10px 20px; color:white; border-radius:10px; cursor:pointer; font-weight:600; }
        .btn-clear { background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid #ef4444; padding:8px 15px; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Koszyk</h1>
        <div id="cartItems" style="margin-top:20px;"></div>
        
        <div style="margin-top:20px; border-top: 1px solid #333; padding-top:20px;">
            <p style="font-size:14px; color:#888;">Kod rabatowy:</p>
            <div style="display:flex; gap:10px;">
                <input type="text" id="promoInput" placeholder="Np. START">
                <button class="btn-promo" onclick="applyPromo()">Zastosuj</button>
            </div>
            <p id="promoMsg" style="color:#10b981; font-size:13px; display:none; margin-top:5px;"></p>
        </div>

        <div class="total">
            <span>Suma:</span>
            <span id="total">0.00</span>
        </div>
        
        <div id="paypal-button-container" style="margin-top:30px;"></div>
        <button class="btn-clear" onclick="clearCart()" style="width:100%; margin-top:15px;">Wyczyść koszyk</button>
        <p style="text-align:center; margin-top:15px;"><a href="index.html" style="color:#8b5cf6; text-decoration:none;">← Wróć do sklepu</a></p>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const CODES = { "START": 0.10, "ECHO20": 0.20 };
        let discount = 0;

        function displayCart() {
            const container = document.getElementById("cartItems");
            const totalElement = document.getElementById("total");
            container.innerHTML = cart.length ? "" : "Twój koszyk jest pusty.";
            let sum = 0;
            cart.forEach(item => {
                container.innerHTML += `<div class="cart-item"><span>${item.name}</span><span>${item.price} PLN</span></div>`;
                sum += item.price;
            });
            let final = sum * (1 - discount);
            totalElement.innerText = final.toFixed(2) + " PLN";
            document.getElementById("paypal-button-container").innerHTML = "";
            if(final > 0) renderPayPal(final);
        }

        function applyPromo() {
            const code = document.getElementById("promoInput").value.toUpperCase();
            if(CODES[code]) {
                discount = CODES[code];
                document.getElementById("promoMsg").innerText = "Zniżka naliczona!";
                document.getElementById("promoMsg").style.display = "block";
                displayCart();
            } else { alert("Zły kod!"); }
        }

        function clearCart() { localStorage.removeItem('cart'); cart = []; displayCart(); }

        function renderPayPal(amount) {
            paypal.Buttons({
                createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: amount.toFixed(2), currency_code: 'PLN' } }] }),
                onApprove: (data, actions) => actions.order.capture().then(() => { alert("Opłacone!"); clearCart(); })
            }).render('#paypal-button-container');
        }
        displayCart();
    </script>
</body>
</html>
