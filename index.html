<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoCode.pl | Premium Development</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        :root { --p-color: #8b5cf6; --p-glow: rgba(139, 92, 246, 0.5); --bg-dark: #050508; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; scroll-behavior: smooth; }
        body { background: var(--bg-dark); color:white; overflow-x:hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: -1; }
        header { padding:20px 10%; display:flex; justify-content:space-between; align-items:center; background: rgba(5, 5, 8, 0.8); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 26px; font-weight: 800; cursor:pointer; }
        .logo span { color: var(--p-color); }
        nav { display: flex; align-items: center; gap: 25px; }
        nav a { text-decoration: none; color: rgba(255,255,255,0.7); font-weight: 600; transition: 0.3s; }
        .cart-btn { background: rgba(139, 92, 246, 0.1); padding: 8px 15px; border-radius: 10px; border: 1px solid var(--p-glow); display: flex; align-items: center; gap: 8px; color: white; text-decoration: none; }
        .hero { padding: 100px 10% 60px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; padding: 40px 10%; }
        .card { background: rgba(255,255,255,0.03); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); transition: 0.4s; text-align: center; }
        .card:hover { transform: translateY(-10px); border-color: var(--p-color); }
        .btn-order { padding: 12px; background: var(--p-color); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index: 10000; }
        .modal-content { background: #0f0f15; width: 400px; padding: 30px; border-radius: 25px; border: 1px solid var(--p-glow); }
        input, textarea { width: 100%; background: #1a1a24; border: 1px solid #333; padding: 12px; border-radius: 10px; color: white; margin: 10px 0; }
        .fly-dot { position: fixed; width: 15px; height: 15px; background: var(--p-color); border-radius: 50%; z-index: 11000; pointer-events: none; transition: all 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045); }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <header>
        <div class="logo"><span>Echo</span>Code</div>
        <nav>
            <a href="zamowienia.html" class="cart-btn">🛒 <span id="cart-count">0</span></a>
        </nav>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Custom Plugin</h3>
            <p>Napisany od zera pod Twój silnik.</p>
            <button class="btn-order" onclick="openModal('Custom Plugin')">Zamów</button>
        </div>
        </div>

    <div id="pluginModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Konfiguracja</h2>
            <input type="text" id="discordNick" placeholder="Twój Discord (nick#0000)">
            <textarea id="pluginDesc" rows="4" placeholder="Szczegóły..."></textarea>
            <p>Budżet: <b id="priceVal">50</b> PLN</p>
            <input type="range" min="20" max="1500" step="10" id="priceRange" value="50" oninput="document.getElementById('priceVal').innerText=this.value">
            <button class="btn-order" style="margin-top:20px" onclick="addToCart(event)">DODAJ DO KOSZYKA</button>
            <p onclick="closeModal()" style="text-align:center; cursor:pointer; margin-top:10px; opacity:0.5">ANULUJ</p>
        </div>
    </div>

    <script>
        particlesJS("particles-js", {"particles":{"number":{"value":50},"color":{"value":"#8b5cf6"},"line_linked":{"enable":true,"color":"#8b5cf6"}}});
        let currentCategory = "";
        function openModal(cat) { currentCategory = cat; document.getElementById('modalTitle').innerText = cat; document.getElementById('pluginModal').style.display='flex'; }
        function closeModal() { document.getElementById('pluginModal').style.display='none'; }

        function addToCart(e) {
            const nick = document.getElementById('discordNick').value;
            const desc = document.getElementById('pluginDesc').value;
            const price = document.getElementById('priceRange').value;
            if(!nick || !desc) return alert("Wypełnij pola!");

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({name: currentCategory, price: parseInt(price), nick, desc});
            localStorage.setItem('cart', JSON.stringify(cart));

            // POWIADOMIENIE DO BAZY I DISCORDA
            fetch('zapisz_zamowienie.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    discord: nick,
                    items: currentCategory,
                    total: price + " PLN",
                    desc: "WSTĘPNE DODANIE: " + desc
                })
            });

            updateBadge();
            closeModal();
            alert("Dodano do koszyka!");
        }
        function updateBadge() { document.getElementById('cart-count').innerText = (JSON.parse(localStorage.getItem('cart')) || []).length; }
        window.onload = updateBadge;
    </script>
</body>
</html>
